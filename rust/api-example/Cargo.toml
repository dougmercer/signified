[package]
name = "signified-api-example"
version = "0.1.0"
edition = "2021"
publish = false
description = "An example Python extension whose signified Computeds are evaluated by Rust kernels, through signified-api."
license = "BSD-3-Clause"

[lib]
name = "signified_api_example"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
signified-api = { path = "../api" }

# Not a member of the engine's workspace: built on its own, like a separate project.
[workspace]

[package]
name = "signified-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The C API of signified's reactive engine: Python extensions create signified Computeds evaluated by native kernels."
license = "BSD-3-Clause"
repository = "https://github.com/dougmercer/signified"
homepage = "https://dougmercer.github.io/signified/latest/native-api/"
documentation = "https://docs.rs/signified-api"
readme = "README.md"
keywords = ["python", "reactive", "signals", "ffi", "pyo3"]
categories = ["api-bindings", "development-tools::ffi", "no-std", "no-std::no-alloc"]
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]

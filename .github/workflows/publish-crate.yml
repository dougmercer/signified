# Publishes the signified-api crate (rust/api) to crates.io when a `signified-api-v<version>` tag
# is pushed. Release the signified version that exports the crate's API version first.
#
# crates.io's trusted publisher is configured for this file name and the `crates-io` environment.
# crates.io can only add a trusted publisher to an existing crate, so the first version is
# published by hand: `cargo publish -p signified-api` from rust/, with an API token.
name: Publish signified-api

on:
  push:
    tags: ["signified-api-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/signified-api
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Require the tag to match the crate's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "signified-api") | .version')
          if [ "signified-api-v${VERSION}" != "${TAG}" ]; then
            echo "::error file=rust/api/Cargo.toml::Tag ${TAG} does not match signified-api ${VERSION}."
            exit 1
          fi
      - name: Test
        run: cargo test -p signified-api
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish -p signified-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

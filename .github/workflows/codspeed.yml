name: CodSpeed

on:
  push:
    branches:
      - "main"
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  codspeed:
    name: Run benchmarks
    # CodSpeed's runner for action@v4 doesn't support ubuntu-latest's 26.04
    # ("Unsupported system"), and a fixed image keeps results comparable over time.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --group test --group dev

      # One process for all benchmarks. Each is measured on a single call,
      # and the first ones in a process also pay the harness's first-use
      # costs; splitting across jobs made adding a benchmark move others in
      # and out of those first places.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: uv run pytest tests/test_benchmarks.py --codspeed -o "addopts="
